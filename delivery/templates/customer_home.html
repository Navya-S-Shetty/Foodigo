{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Page</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>

    <div class="page">

        <h1 class="page-title">
            Welcome {{username}} 👋
        </h1>

        <p class="page-subtitle">
            Explore top restaurants and order your favorite meals.
        </p>

        <table class="modern-table">

            <thead>

                <tr>

                    <th>Restaurant</th>

                    <th>Picture</th>

                    <th>Cuisine</th>

                    <th>Rating</th>

                    <th>Operations</th>

                </tr>

            </thead>

            <tbody>

                {% for r in restaurantList %}

                <tr>

                    <td>{{ r.name }}</td>

                    <td>
                        <img src="{{ r.picture }}" class="restaurant-img">
                    </td>

                    <td>{{ r.cuisine }}</td>

                    <td>
                        ⭐ {{ r.rating }}
                    </td>

                    <td>

                        <a href="{% url 'view_menu' r.id username %}" class="view-menu-btn">
                            View Menu

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
