{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>

<div class="admin-form-page">

    <div class="admin-form-card">

        <h1 class="admin-form-title">
            Add New Restaurant
        </h1>

        <p class="admin-form-subtitle">
            Enter restaurant details below.
        </p>

        <form action="{% url 'add_restaurant' %}" method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Restaurant Name</label>

                <input type="text" name="name" placeholder="Enter restaurant name" required>

            </div>

            <div class="form-group">

                <label>Picture URL</label>

                <input type="text" name="picture" placeholder="Paste image URL" required>

            </div>

            <div class="form-group">

                <label>Cuisine</label>

                <input type="text" name="cuisine" placeholder="Enter cuisine type" required>

            </div>

            <div class="form-group">

                <label>Rating</label>

                <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="0 - 5" required>

            </div>

            <button type="submit" class="admin-submit-btn">
                Add Restaurant
            </button>

        </form>

    </div>

</div>

</body>
</html>
